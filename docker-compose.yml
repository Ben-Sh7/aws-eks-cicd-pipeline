# Production-like local run of the whole stack, from the real images:
#   docker compose up --build        ->  http://localhost:3000
# For day-to-day development, start only the database and run both apps with
# `npm run start:dev` / `npm run dev` for hot reload:
#   docker compose up -d postgres-db
# Values come from .env (see .env.example). The dev servers read their own
# app/backend/.env and app/frontend/.env.local instead (see each .env.example).

services:
  postgres-db:
    # Same major version as RDS (terraform variable rds_engine_version).
    image: postgres:16-alpine
    container_name: task_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-tasksdb}
    # Loopback only: reachable from this machine, not from the network.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      # $$ defers expansion to the container, so the check follows the
      # configured user and database instead of hardcoding them.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./app/backend
    container_name: task_backend
    environment:
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-tasksdb}
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    # No published port: as in the cluster, only the frontend reaches the backend.
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./app/frontend
    container_name: task_frontend
    # Each service gets only its own secrets: the Google client secret never
    # reaches the backend, and the JWT secret never reaches the frontend.
    environment:
      APP_URL: http://localhost:3000
      BACKEND_URL: http://backend:3001
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pg_data:
