{{- if eq .Values.secrets.mode "externalSecrets" }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secret
  labels:
    app: task-manager
    {{- include "task-manager.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    name: app-secretstore
    kind: SecretStore
  target:
    name: app-secret
    creationPolicy: Owner
  data:
    # AWS writes the RDS master secret with "username"/"password" keys - the
    # app reads DB_USER/DB_PASSWORD, so they're renamed here.
    - secretKey: DB_USER
      remoteRef:
        key: {{ .Values.secrets.awsSecretName }}
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ .Values.secrets.awsSecretName }}
        property: password
    # Generated by Terraform (terraform/app-secrets.tf) as a plain string, so
    # there is no property: the whole value is the key.
    - secretKey: JWT_SECRET
      remoteRef:
        key: {{ required "secrets.jwtSecretName is required (create.sh passes it from terraform output jwt_secret_name)" .Values.secrets.jwtSecretName }}
{{- end }}
