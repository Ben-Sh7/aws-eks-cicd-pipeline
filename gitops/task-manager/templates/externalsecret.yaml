{{- if eq .Values.secrets.mode "externalSecrets" }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secret
  labels:
    app: task-manager
    {{- include "task-manager.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    name: app-secretstore
    kind: SecretStore
  target:
    name: app-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_USER
      remoteRef:
        key: {{ .Values.secrets.awsSecretName }}
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ .Values.secrets.awsSecretName }}
        property: password
    - secretKey: JWT_SECRET
      remoteRef:
        key: {{ required "secrets.jwtSecretName is required (Terraform passes it as an ArgoCD helm parameter)" .Values.secrets.jwtSecretName }}
    {{- if .Values.secrets.googleSecretName }}
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: {{ .Values.secrets.googleSecretName }}
        property: GOOGLE_CLIENT_ID
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef:
        key: {{ .Values.secrets.googleSecretName }}
        property: GOOGLE_CLIENT_SECRET
    {{- end }}
{{- end }}
