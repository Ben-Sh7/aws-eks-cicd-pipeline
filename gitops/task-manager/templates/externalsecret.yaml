{{- if eq .Values.secrets.mode "externalSecrets" }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secret
  labels:
    app: task-manager
    {{- include "task-manager.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    name: app-secretstore
    kind: SecretStore
  target:
    name: app-secret
    creationPolicy: Owner
  data:
    # AWS writes the RDS master secret with "username"/"password" keys - the
    # app reads DB_USER/DB_PASSWORD, so they're renamed here.
    - secretKey: DB_USER
      remoteRef:
        key: {{ .Values.secrets.awsSecretName }}
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ .Values.secrets.awsSecretName }}
        property: password
    # Generated by Terraform (terraform/app-secrets.tf) as a plain string, so
    # there is no property: the whole value is the key.
    - secretKey: JWT_SECRET
      remoteRef:
        key: {{ required "secrets.jwtSecretName is required (Terraform passes it as an ArgoCD helm parameter)" .Values.secrets.jwtSecretName }}
    {{- if .Values.secrets.googleSecretName }}
    # Google sign-in. Terraform creates this secret holding a placeholder and
    # never learns the real value - it is written straight into AWS once (see
    # `terraform output google_oauth_setup`). Until then these two keys carry
    # the placeholder and Google sign-in simply refuses every token, which is
    # why the app keeps username + password accounts as well.
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: {{ .Values.secrets.googleSecretName }}
        property: GOOGLE_CLIENT_ID
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef:
        key: {{ .Values.secrets.googleSecretName }}
        property: GOOGLE_CLIENT_SECRET
    {{- end }}
{{- end }}
