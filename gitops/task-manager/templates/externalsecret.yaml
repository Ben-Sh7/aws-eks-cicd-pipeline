{{- /* Materializes DB_USER/DB_PASSWORD as the "app-secret" K8s Secret. */ -}}
{{- if eq .Values.secrets.mode "externalSecrets" }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secret
  labels:
    app: task-manager
    {{- include "task-manager.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    name: app-secretstore
    kind: SecretStore
  target:
    name: app-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_USER
      remoteRef:
        key: {{ .Values.secrets.awsSecretName }}
        property: DB_USER
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ .Values.secrets.awsSecretName }}
        property: DB_PASSWORD
{{- end }}
