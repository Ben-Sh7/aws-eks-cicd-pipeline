{{- if eq .Values.secrets.mode "local" }}
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  labels:
    app: task-manager
    {{- include "task-manager.labels" . | nindent 4 }}
type: Opaque
data:
  DB_USER: {{ .Values.secrets.dbUser | toString | b64enc }}
  DB_PASSWORD: {{ .Values.secrets.dbPassword | toString | b64enc }}
  JWT_SECRET: {{ required "secrets.jwtSecret is required in local mode (at least 32 characters)" .Values.secrets.jwtSecret | toString | b64enc }}
{{- end }}
