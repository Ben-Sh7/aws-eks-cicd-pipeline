{{- if eq .Values.secrets.mode "externalSecrets" }}
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: app-secretstore
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  labels:
    app: task-manager
    {{- include "task-manager.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.secrets.awsRegion }}
{{- end }}
