apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  labels:
    app: frontend
    {{- include "task-manager.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: {{ .Values.frontend.port }}
    protocol: TCP
    name: http
  selector:
    app: frontend
