apiVersion: v1
kind: Service
metadata:
  name: backend-service
  labels:
    app: backend
    {{- include "task-manager.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.backend.port }}
    targetPort: {{ .Values.backend.port }}
    protocol: TCP
    name: http
  selector:
    app: backend
