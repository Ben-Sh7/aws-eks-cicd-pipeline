# Image tags are overridden by values-images.yaml (bumped by Jenkins CI).
# The image repositories are empty on purpose, for the same reason as
# config.dbHost below: the ECR registry URL contains the AWS account id, which
# differs per deployment, so create.sh passes both in as ArgoCD helm parameters
# straight from the terraform ECR outputs. Hardcoding one account here means
# every other account gets ImagePullBackOff.

backend:
  image:
    repository: ""
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 3
  port: 3001
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  image:
    repository: ""
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Non-sensitive shared configuration (rendered into the app-config ConfigMap).
# dbHost is empty on purpose: the RDS endpoint only exists after terraform
# apply, so create.sh passes it in as an ArgoCD helm parameter.
config:
  dbHost: ""
  dbPort: "5432"
  dbName: tasksdb
  backendUrl: http://backend-service:3001
  backendPort: "3001"

# mode: externalSecrets (default) - pulls the RDS master credentials from
#   AWS Secrets Manager via the External Secrets Operator. No real
#   credentials here. awsSecretName is empty for the same reason as dbHost:
#   AWS generates the secret's name, so create.sh passes it in.
# mode: local - renders a plain Secret from dbUser/dbPassword below, for
#   local/demo use only (via a gitignored values-secret.yaml).
secrets:
  mode: externalSecrets
  awsRegion: us-east-1
  awsSecretName: ""
  refreshInterval: 1h
  dbUser: ""
  dbPassword: ""

ingress:
  enabled: true
  className: nginx
  # Empty host = match-all path rule (no hostname restriction).
  host: ""
