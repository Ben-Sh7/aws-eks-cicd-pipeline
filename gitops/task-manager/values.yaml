# Image tags are overridden by values-images.yaml (bumped by Jenkins CI).
# The image repositories are empty on purpose, for the same reason as
# config.dbHost below: the ECR registry URL contains the AWS account id, which
# differs per deployment, so Terraform passes both to ArgoCD as helm parameters
# on the Application it creates (terraform/helm-addons.tf). Hardcoding one
# account here means every other account gets ImagePullBackOff.

backend:
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 3
  port: 3001
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Non-sensitive shared configuration (rendered into the app-config ConfigMap).
# dbHost and appUrl are empty on purpose: the RDS endpoint is generated per
# deployment and the app's address comes from the domain Terraform was given,
# so both arrive as ArgoCD helm parameters.
config:
  dbHost: ""
  dbPort: "5432"
  dbName: tasksdb
  backendUrl: http://backend-service:3001
  backendPort: "3001"
  # The exact address users open, e.g. https://app.example.com. The frontend
  # accepts sign-ins and form submissions only from this origin (CSRF
  # protection), so the chart refuses to render without it.
  appUrl: ""
  # Path to the Amazon RDS CA bundle inside the backend image. Set means the
  # DB connection is TLS with certificate verification; empty means plaintext,
  # which only makes sense against a local Postgres.
  dbSslCa: /app/rds-ca.pem

# mode: externalSecrets (default) - pulls the RDS master credentials, the JWT
#   signing key and the Google OAuth client from AWS Secrets Manager via the
#   External Secrets Operator. No real credentials here. The three *SecretName
#   values are empty for the same reason as dbHost: AWS generates the names, so
#   Terraform passes them in.
# mode: local - renders a plain Secret from dbUser/dbPassword/jwtSecret below,
#   for a local or demo install only (minikube, kind). The values for it live
#   outside the repository, in the gitignored local/ directory - see
#   local/values-secret.yaml.example.
secrets:
  mode: externalSecrets
  awsRegion: us-east-1
  awsSecretName: ""
  jwtSecretName: ""
  # Login the app connects to Postgres with. The db-bootstrap job creates the
  # role from the master credentials; the pods never see the master password.
  appDbSecretName: ""
  # Holds GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET as one JSON document.
  # Empty switches Google sign-in off entirely - the app then offers username +
  # password accounts only, and nothing in the chart references the credential.
  googleSecretName: ""
  refreshInterval: 1h
  dbUser: ""
  dbPassword: ""
  jwtSecret: ""

# Locks the namespace down to the one path the app needs: ingress-nginx may
# reach the frontend, the frontend may reach the backend, and only the backend
# may reach the database. Needs a CNI that enforces policies - Terraform turns
# that on in the EKS vpc-cni addon. Turn it off for a local install whose CNI
# ignores them, where it would give a false sense of isolation.
networkPolicy:
  enabled: true

# One-shot job that creates the application's Postgres role and hands it the
# app's own tables. Runs before the deployments on every sync, and is a no-op
# once the role exists and its password is unchanged.
dbBootstrap:
  image: postgres:16-alpine
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

ingress:
  enabled: true
  className: nginx
  # The hostname the app answers on, passed in by Terraform. Empty = match-all
  # path rule (no hostname restriction), which is what a local minikube install
  # wants.
  host: ""
  # Send plain HTTP to HTTPS. Only makes sense where a certificate exists -
  # turn it off for local installs, which have none.
  forceSslRedirect: true
